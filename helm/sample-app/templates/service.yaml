apiVersion: v1
kind: Service
metadata:
  name: {{ include "sample-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # Selector omits instance/release name so the stable Service can be
  # re-pointed between blue/green release pods by patching `slot`.
  selector:
    app.kubernetes.io/name: {{ include "sample-app.name" . }}
    slot: {{ .Values.slot }}
