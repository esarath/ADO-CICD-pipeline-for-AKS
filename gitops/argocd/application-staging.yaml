# ArgoCD Application - staging track (auto-sync from Git main branch).
# Replace <GIT_REPO_URL> with the Azure DevOps repo HTTPS URL.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sampleapp-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: '<GIT_REPO_URL>'
    targetRevision: main
    path: helm/sample-app
    helm:
      valueFiles:
        - values-staging.yaml
      parameters:
        - name: image.repository
          value: '<ACR_NONPROD>.azurecr.io/sampleapp'
        - name: image.tag
          value: 'dev-latest'
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
